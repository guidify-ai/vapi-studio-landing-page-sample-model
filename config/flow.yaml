version: 1
flow:
  id: sample-landing-demo
  start: greet
  # Spec: config/demo-conversation.yml

# —— Intention meanings for the Brain scanner (required by decision drivers) ——
intentions:
  entry_sales: Caller wants to use Vapi Studio for their business or a project, or talk to someone about using it.
  entry_docs: Caller has a question about how Vapi Studio works or where its docs are.
  entry_support: Something in Vapi Studio is broken or not working for the caller (bug, crash, wrong routing).
  entry_feature: Caller suggests a feature, idea, or improvement for Vapi Studio.
  entry_exploring: Caller is just trying the demo, looking around, or curious, with no specific goal.
  entry_clarify: Caller's reason for calling is unclear and fits none of project, question, problem, feature idea, or exploring.
  sales_business: Caller names or describes their business or industry, or lets the assistant pick one.
  sales_use_case: Caller describes what they want a voice agent to do (the use case).
  sales_discovery: Caller says how they heard about Vapi Studio.
  sales_consent_yes: Caller agrees to be contacted about their project.
  sales_consent_no: Caller declines being contacted about their project.
  docs_question: Caller asks a question about Vapi Studio, its docs, or how to build with it.
  docs_done: Caller has no more questions (that's all, I'm good, no thanks).
  support_issue: Caller describes the problem they have with Vapi Studio.
  support_detail: Caller gives more detail about their problem (steps, error message, version).
  support_consent_yes: Caller agrees to be contacted about their problem.
  support_consent_no: Caller declines being contacted about their problem.
  feature_description: Caller describes the feature or improvement they want.
  feature_consent_yes: Caller agrees to be contacted about their feature idea.
  feature_consent_no: Caller declines being contacted about their feature idea.
  phone_reuse_yes: Caller agrees to be contacted at the number they are calling from.
  phone_reuse_no: Caller does not want to be contacted at the number they are calling from.
  contact_phone: Caller states a phone number to be contacted at.
  contact_prefer_email: Caller prefers to be contacted by email.
  contact_prefer_call: Caller prefers to be contacted by a phone call.
  contact_email_collect: Caller states or spells an email address.
  optional_skip: Caller declines to answer an optional question (skip, rather not say, no idea).
  nothing_else: Caller has nothing else they need and is wrapping up.
  isContinue: Caller is back or ready to resume after a pause, silence check, or upset moment (I'm here, go on, okay).

nodes:
  greet:
    class: DemoGreetNode
    intentions:
      - entry_sales
      - entry_docs
      - entry_support
      - entry_feature
      - entry_exploring
      - entry_clarify
      - studio.isGoodbye
  clarifyEntry:
    class: DemoClarifyEntryNode
    intentions:
      - entry_sales
      - entry_docs
      - entry_support
      - entry_feature
      - entry_exploring
      - entry_clarify
      - studio.isGoodbye
  # Project and exploring share this path; exploring only changes the business ask.
  salesEntry:
    class: DemoSalesEntryNode
    intentions:
      - entry_sales
  salesBusiness:
    class: DemoSalesBusinessNode
    intentions:
      - sales_business
      - optional_skip
      - studio.isGoodbye
  salesUseCase:
    class: DemoSalesUseCaseNode
    intentions:
      - sales_use_case
      - studio.isGoodbye
  salesDiscovery:
    class: DemoSalesDiscoveryNode
    intentions:
      - sales_discovery
      - optional_skip
      - studio.isGoodbye
  salesConsent:
    class: DemoSalesConsentNode
    intentions:
      - sales_consent_yes
      - sales_consent_no
      - studio.isGoodbye
  salesNoContactEnd:
    class: DemoSalesNoContactEndNode
    terminal: true
    intentions:
      - studio.isGoodbye
  supportEntry:
    class: DemoSupportEntryNode
    intentions:
      - entry_support
  supportIssue:
    class: DemoSupportIssueNode
    intentions:
      - support_issue
      - studio.isGoodbye
  # Mails the issue report to the Studio team before the consent question.
  supportDetail:
    class: DemoSupportDetailNode
    intentions:
      - support_detail
      - optional_skip
      - studio.isGoodbye
  supportConsent:
    class: DemoSupportConsentNode
    intentions:
      - support_consent_yes
      - support_consent_no
      - studio.isGoodbye
  supportNoContactEnd:
    class: DemoSupportNoContactEndNode
    terminal: true
    intentions:
      - studio.isGoodbye
  featureEntry:
    class: DemoFeatureEntryNode
    intentions:
      - entry_feature
  featureDescription:
    class: DemoFeatureDescriptionNode
    intentions:
      - feature_description
      - studio.isGoodbye
  featureConsent:
    class: DemoFeatureConsentNode
    intentions:
      - feature_consent_yes
      - feature_consent_no
      - studio.isGoodbye
  featureNoContactEnd:
    class: DemoFeatureNoContactEndNode
    terminal: true
    intentions:
      - studio.isGoodbye
  # Answers from the public GitHub repos (docs advisor), loops for more questions.
  docsAnswer:
    class: DemoDocsAnswerNode
    intentions:
      - entry_docs
      - docs_question
      - studio.isGoodbye
  docsEnd:
    class: DemoDocsEndNode
    terminal: true
    intentions:
      - docs_done
      - studio.isGoodbye
  contactMethod:
    class: DemoContactMethodNode
    # Reach only via continueTo after consent is granted on sales/support/…
    intentions:
      - contact_prefer_email
      - contact_prefer_call
      - contact_email_collect
      - studio.isGoodbye
  callerPhoneConsent:
    class: DemoCallerPhoneConsentNode
    intentions:
      - phone_reuse_yes
      - phone_reuse_no
      - studio.isGoodbye
  requestPhone:
    class: DemoRequestPhoneNode
    intentions:
      - contact_phone
      - studio.isGoodbye
  emitOutcome:
    class: DemoEmitOutcomeNode
    # Reach only via continueTo from contactMethod / requestPhone / callerPhoneConsent.
    # Do NOT list contact_phone here — nodesForIntention sorts by id and would
    # pick emitOutcome over requestPhone, skipping parse/retry.
    intentions: []
  salesSuccessEnd:
    class: DemoSalesSuccessEndNode
    terminal: true
    intentions:
      - studio.isGoodbye
  supportSuccessEnd:
    class: DemoSupportSuccessEndNode
    terminal: true
    intentions:
      - studio.isGoodbye
  featureSuccessEnd:
    class: DemoFeatureSuccessEndNode
    terminal: true
    intentions:
      - studio.isGoodbye
  contactFailureEnd:
    class: DemoContactFailureEndNode
    terminal: true
    intentions:
      - studio.isGoodbye
  farewell:
    class: GoodbyeNode
    terminal: true
    intentions:
      - studio.isGoodbye
      - nothing_else
  continue:
    class: ContinueNode
    intentions:
      - isContinue
  unknownTransition:
    class: UnknownTransitionNode
    portal: true
    priority: 80
    intentions:
      - studio.isUnknownTransition
      - isContinue
  stillThere:
    class: StillThereNode
    portal: true
    priority: 92
    intentions:
      - studio.isStillThere
      - studio.isPositive
      - studio.isGoodbye
      - isContinue
  mad:
    class: MadNode
    portal: true
    priority: 95
    intentions:
      - studio.isMad
      - isContinue
  transferToHuman:
    class: TransferToHumanNode
    portal: true
    priority: 98
    intentions:
      - studio.isTransferToHuman
      - isContinue
